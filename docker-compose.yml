services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smartdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartdocs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smartdocs-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartdocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  smartdocs-postgres-data:
